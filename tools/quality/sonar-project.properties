# SonarQube Configuration for Vertex AI Master CLI

# Project identification
sonar.projectKey=vertex-ai-master
sonar.projectName=Vertex AI Master CLI
sonar.projectVersion=1.0.0

# Source and test directories
sonar.sources=src/main/java
sonar.tests=src/test/java

# Java source and test directories
sonar.java.source=25
sonar.java.target=25

# Source encoding
sonar.sourceEncoding=UTF-8

# Exclude test files from main analysis
sonar.exclusions=**/*Test.java,**/*Tests.java

# Include test coverage if available
sonar.coverage.jacoco.reportPaths=target/jacoco.exec

# Java class files directory for better analysis
sonar.java.binaries=target/classes

# Architecture-specific properties
sonar.inclusions=**/com/jguru/vertexai/**

# Clean Architecture layer analysis
sonar.java.libraries=${env.MAVEN_HOME}/lib/*
