# ArchUnit Configuration for Clean Architecture Validation

# Package dependencies rules
com.jguru.vertexai.domain.. should only be accessed by com.jguru.vertexai.domain.., com.jguru.vertexai.application.., com.jguru.vertexai.adapter.., com.jguru.vertexai.infrastructure..

com.jguru.vertexai.application.. should only be accessed by com.jguru.vertexai.application.., com.jguru.vertexai.adapter.., com.jguru.vertexai.infrastructure..

com.jguru.vertexai.adapter.. should only be accessed by com.jguru.vertexai.adapter.., com.jguru.vertexai.infrastructure..

# Layer dependencies - Inner layers should not depend on outer layers
com.jguru.vertexai.domain.. should not depend on com.jguru.vertexai.application.., com.jguru.vertexai.adapter.., com.jguru.vertexai.infrastructure..

com.jguru.vertexai.application.. should not depend on com.jguru.vertexai.infrastructure..

# Naming conventions
layer.domain = com.jguru.vertexai.domain..
layer.application = com.jguru.vertexai.application..
layer.interface_adapters = com.jguru.vertexai.adapter..
layer.infrastructure = com.jguru.vertexai.infrastructure..

